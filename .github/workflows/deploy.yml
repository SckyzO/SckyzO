name: "🚀 Deploy CV"

on:
  push:
    branches:
      - main
    paths:
      - cv/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv
    env:
      CV_CONTACT_EMAIL: ${{ secrets.CV_CONTACT_EMAIL }}
      CV_CONTACT_PHONE: ${{ secrets.CV_CONTACT_PHONE }}
    steps:
      - name: "🧾 Checkout"
        uses: actions/checkout@v7

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cv/package-lock.json

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "✅ Validate data/data.json"
        run: npm run validate

      - name: "🧭 Install Playwright browsers"
        run: npx playwright install --with-deps chromium

      - name: "⬇️ Download offline assets"
        run: node build/download-assets.js

      - name: "🏗️ Build CV outputs"
        run: node build/build.js

      - name: "📦 Prepare deploy artifact"
        run: |
          rm -rf out
          mkdir -p out
          cp -R assets out/assets
          shopt -s nullglob
          for file in dist/*.html dist/*.pdf dist/*.png dist/*.md dist/*.txt; do
            cp "$file" out/
          done
          cp dist/.htaccess out/
          cp dist/robots.txt out/

      - name: "📤 Upload Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: cv/out

      - name: "📤 Upload build artifact"
        uses: actions/upload-artifact@v7
        with:
          name: cv-build
          path: cv/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "🌍 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-sftp:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "⬇️ Download build artifact"
        uses: actions/download-artifact@v8
        with:
          name: cv-build
          path: cv-out

      - name: "🔐 Install lftp and ssh"
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp openssh-client
          /usr/bin/ssh -V

      - name: "📤 Deploy build via lftp (SFTP mirror, delete remote)"
        run: |
          lftp -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            lcd ${GITHUB_WORKSPACE}/cv-out;
            open -u ${SFTP_USER},${SFTP_PASSWORD} sftp://${SFTP_HOST}:${SFTP_PORT};
            cd ${SFTP_REMOTE_PATH};
            mirror --reverse --delete --verbose . .;
            bye
          "
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
