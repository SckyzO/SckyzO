name: "🧰 Generate and Deploy CV"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CV_CONTACT_EMAIL: ${{ secrets.CV_CONTACT_EMAIL }}
      CV_CONTACT_PHONE: ${{ secrets.CV_CONTACT_PHONE }}
    steps:
      - name: "🧾 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cv/package.json

      - name: "📦 Install dependencies"
        run: cd cv && npm install

      - name: "🧭 Install Playwright browsers"
        run: cd cv && npx playwright install chromium --with-deps

      - name: "🏗️ Build CV (HTML, PDF, MD)"
        run: cd cv && npm run build

      - name: "📤 Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: cv-outputs
          path: |
            cv/dist/*.html
            cv/dist/*.pdf
            cv/dist/*.md
            cv/dist/*.png

