name: "✅ PR checks"

on:
  pull_request:
    paths:
      - "cv/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: "🔎 Validate CV data"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv
    env:
      # build.js --validate-only asserts contact fields; provide the same
      # secrets deploy.yml uses so validation runs without a local .env.
      CV_CONTACT_EMAIL: ${{ secrets.CV_CONTACT_EMAIL }}
      CV_CONTACT_PHONE: ${{ secrets.CV_CONTACT_PHONE }}
    steps:
      - name: "🧾 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cv/package-lock.json

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "✅ Validate data"
        run: npm run validate

      - name: "🧹 Lint"
        run: npm run lint

      - name: "🧪 Unit tests"
        run: npm test
