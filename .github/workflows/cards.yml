# .github/workflows/cards.yml
name: Profile cards

on:
  schedule:
    - cron: '0 6 * * *'   # daily: README data changes slowly, so fewer bot commits
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/cards/**', '.github/workflows/cards.yml']

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Run card generator tests
        run: node --test '.github/cards/**/*.test.js'

      - name: Generate README sections and header/footer SVGs
        env:
          CARDS_TOKEN: ${{ secrets.CARDS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/cards/generate.mjs

      - name: Commit changed assets
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c  # v7.2.1
        with:
          commit_message: 'chore(cards): refresh profile README'
          file_pattern: 'README.md assets/*.svg'
